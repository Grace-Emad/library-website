<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Books - Online Library</title>
</head>
<body>
    <header>
        <h1>Online Library</h1>
        <nav>
            <a href="../index.html">Home</a> |
            <a href="#">Search Books</a> |
            <a href="user_borrowed.html">My Borrowed Books</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>Search for a Book</h2>
            <form action="#" method="GET">
                <label for="search_query">Search: </label>
                <input type="text" id="search_query" name="search_query" placeholder="Type here...">
                
                <label for="search_by">By: </label>
                <select id="search_by" name="search_by">
                    <option value="title">Title</option>
                    <option value="author">Author</option>
                    <option value="category">Category</option>
                </select>
                
                <button type="submit">Search</button>
            </form>
        </section>

        <section>
            <h2>Search Results</h2>
            <div class="results-container">

            </div>
        </section>
    </main>
    <script src="../user.js"></script>
</body>
</html>
