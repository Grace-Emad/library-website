<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <meta charset="UTF-8">
    <title>Sign Up</title>
</head>
<body>
    <header>
        <header>
            <nav class="navbar">
                <b><a href="../indexUser.html">Online Library</a></b>
            </nav>
        </header>
    </header>
    <main>
        <section class="formContainer">
            <div class="headings">
                <h2 class="lobsterFont">Sign Up</h2>
            </div>
            <form action="#" id="signUpForm">
                <input type="text" id="username" name="username" placeholder="Username" required class="formInput"><br><br>
                <input type="password" id="password" name="password" placeholder="Password" required class="formInput">
                <br><br>
                <input type="password" id="confPass" name="confPass" placeholder="Confirm Password" required class="formInput">
                <p id="confPassError" class="errorMessages" style="display:none"></p>
                <br><br>

                <input type="email" id="email" name="email" placeholder="Email" required class="formInput">
                <p id="emailError" class="errorMessages"></p>

                <div class="checkbox-wrapper">
                    <label for="isAdmin">is Admin</label>
                    <input type="checkbox" id="isAdmin" name="isAdmin">
                </div>


                <br>
                <p id="signUpError" class="errorMessages"></p>

                <input type="submit" value="Sign Up" id="signUpSubmit" class="btn">
                <p>Already have an account? <a href="login.html">Login</a></p>
            </form>
        </section>

    </main>

    <script src="../auth.js"></script>

</body>
</html>
