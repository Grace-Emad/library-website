<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <meta charset="UTF-8">
    <title>Log In</title>
</head>
<body>
    <header>
        <nav class="navbar">
            <b><a href="../indexUser.html">Online Library</a></b>
        </nav>
    </header>
    <main>
        <section class="formContainer">
            <h2 class="lobsterFont">Login</h2>
            <form id="loginForm" action="#">

                <input type="text" id="username" name="username" placeholder="username" required class="formInput"><br><br>

                <input type="password" id="password" name="password" placeholder="password" required class="formInput">
                <br><br>
                <p id="loginError" class="errorMessages"></p>

                <input type="submit" value="Login" id="loginSubmit" class="btn">

                <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
            </form>
        </section>

    </main>

    <script src="../auth.js"></script>

</body>
</html>
