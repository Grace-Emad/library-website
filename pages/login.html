<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log In</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar">
        <b>Online Library</b>
        <ul class="pageOptions" id="navLinks"></ul>
        <div id="beforeAuth" class="logContainer hidden">
            <a href="login.html" class="navbarBtns">Login</a>
            <a href="signup.html" class="navbarBtns">Sign Up</a>
        </div>
        <div id="afterAuth" class="logContainer hidden">
            <span id="userGreeting" style="margin-right: 15px;"></span>
            <button id="logOutBtn" class="navbarBtns">Log Out</button>
        </div>
    </nav>
    <main class="container">
        <section class="form-container">
            <h2>Login</h2>
            <form id="loginForm" action="#">
                <label for="username">Username: </label><br>
                <input type="text" id="username" name="username" placeholder="username" required class="formInput"><br><br>

                <label for="password">Password: </label><br>
                <input type="password" id="password" name="password" placeholder="password" required minlength="6" class="formInput">
                <br><br>
                <p id="loginError" class="errorMessages" style="color: var(--error-color);"></p>

                <input type="submit" value="Login" id="loginSubmit" class="btn">

                <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
            </form>
        </section>
    </main>

    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
