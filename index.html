<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/queries.css">
    <link rel="icon" type="image/x-icon" href="images/icon.png">
    <meta charset="UTF-8">
    <title>Online Library - Home</title>
</head>
<body>
    <nav class="navbar">
        <div class="iconName">
            <img src="images/icon.png" alt="icon" width="30px">
            <b>Online Library</b>
        </div>
        <ul class="pageOptions" id="navLinks">
            <!-- Dynamically injected links based on role -->
        </ul>
        <div id="beforeAuth" class="logContainer hidden">
            <a href="pages/login.html" class="navbarBtns">Login</a>
            <a href="pages/signup.html" class="navbarBtns">Sign Up</a>
        </div>

        <div id="afterAuth" class="logContainer hidden">
            <span id="userGreeting" style="margin-right: 15px;"></span>
            <button id="logOutBtn" class="navbarBtns">Log Out</button>
        </div>
    </nav>

    <main class="container" id="homeContainer">
        <div class="homeWelcome">
            <h1>Welcome to the Online Library</h1>
            <p class="headerText">Discover a world of knowledge. Search our catalog, borrow your favorite books, and manage your reading list all in one place.</p>
        </div>
        <div class="cards">
            <a href="pages/search_books.html">
                <img src="images/img1.jpg" alt="programming book" class="img">
            </a>
            <a href="pages/search_books.html">
                <img src="images/img2.jpg" alt="coding book" class="img">
            </a>
            <a href="pages/search_books.html">
                <img src="images/img3.jpg" alt="literature book" class="img">
            </a>
            <a href="pages/search_books.html">
                <img src="images/img4.jpg" alt="literature book" class="img">
            </a>
            <a href="pages/search_books.html">
                <img src="images/img5.jpg" alt="kids coloring book" class="img">
            </a>

        </div>
    </main>
    <footer>
        <div class="footer">
            <div class="iconName">
                <img src="images/icon.png" alt="icon" width="30px">
                <b>Online Library</b>
            </div>
            <p>@2026 FCAI. all rights reserved </p>
            <p>Terms of Services</p>
            <div class="socialMediaIcons">
                <img src="images/facebook.png" alt="Facebook icon" width="40px">
                <img src="images/twitter.png" alt="Twitter icon" width="30px">
                <img src="images/instagram.png" alt="Instagram icon" width="30px">
            </div>
        </div>

    </footer>
    <script src="js/main.js"></script>
</body>
</html>
